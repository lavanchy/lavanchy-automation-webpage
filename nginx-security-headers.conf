# Security-Header, per include in nginx.conf eingebunden. nginx vererbt add_header nur,
# wenn eine location selbst kein add_header setzt; deshalb muss jede location mit eigenem
# add_header (z. B. Cache-Control) diese Datei ebenfalls einbinden.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HTTPS erzwingen (1 Jahr, inkl. www/analytics; alle Subdomains laufen über Traefik mit TLS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Die eigentliche CSP (script-src/style-src mit Hashes) setzt Astro als <meta> ins HTML
# (astro.config.mjs, security.csp). frame-ancestors wirkt nur als HTTP-Header.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
