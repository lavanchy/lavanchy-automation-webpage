server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root -> /de/ (belt-and-suspenders alongside Astro's own redirect page;
    # this one is a real HTTP 301 instead of a meta-refresh).
    # Explicit https:// scheme: nginx sits behind Traefik's TLS termination
    # and only ever sees plain HTTP internally, so a relative "/de/" target
    # would make nginx build an absolute "http://" Location header itself.
    location = / {
        return 301 https://$host/de/;
    }

    # Hashed build assets: cache forever, filenames change on content change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
