# Läuft auf dem Webseiten-VPS (nicht Teil des CI/CD-Images).
# Einmalig manuell auf den VPS kopieren (siehe README "Manuelle Hostinger-Schritte"),
# danach übernimmt GitHub Actions nur noch das Update des "website"-Containers.
#
# Vor dem ersten Start: .env.example nach .env kopieren und Werte eintragen.

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  website:
    image: ghcr.io/lavanchy/lavanchy-automation-webpage:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.website.rule=Host(`lavanchyautomation.ch`) || Host(`www.lavanchyautomation.ch`)
      - traefik.http.routers.website.entrypoints=websecure
      - traefik.http.routers.website.tls.certresolver=le
      - traefik.http.services.website.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  letsencrypt:
