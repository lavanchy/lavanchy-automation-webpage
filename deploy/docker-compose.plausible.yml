# Self-hosted Plausible Analytics (Community Edition) auf demselben VPS.
# Wird zusätzlich zur Haupt-docker-compose.yml gestartet:
#   docker compose -f docker-compose.yml -f docker-compose.plausible.yml up -d
#
# Basiert auf dem offiziellen Plausible-CE-Compose-Aufbau (plausible/plausible-ce +
# eigene Postgres- und ClickHouse-Instanz), hier nur um Traefik-Labels ergänzt,
# damit Let's Encrypt automatisch für analytics.lavanchyautomation.ch mitläuft.
#
# Vor dem ersten Start in .env ergänzen:
#   SECRET_KEY_BASE   (openssl rand -base64 64)
#   TOTP_VAULT_KEY    (openssl rand -base64 32)
# SMTP-Variablen sind optional (nötig für E-Mail-Reports/Einladungen) und können
# später nachgetragen werden — Plausible läuft auch ohne SMTP für den Eigengebrauch.

services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3
    restart: unless-stopped
    depends_on:
      - plausible_db
      - plausible_events_db
    environment:
      - BASE_URL=https://analytics.lavanchyautomation.ch
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE}
      - TOTP_VAULT_KEY=${PLAUSIBLE_TOTP_VAULT_KEY}
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db
      # TODO (optional): SMTP_HOST_ADDR, SMTP_HOST_PORT, SMTP_USER_NAME, SMTP_USER_PWD
    labels:
      - traefik.enable=true
      - traefik.http.routers.plausible.rule=Host(`analytics.lavanchyautomation.ch`)
      - traefik.http.routers.plausible.entrypoints=websecure
      - traefik.http.routers.plausible.tls.certresolver=le
      - traefik.http.services.plausible.loadbalancer.server.port=8000

  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - plausible-db-data:/var/lib/postgresql/data

  plausible_events_db:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - plausible-events-db-data:/var/lib/clickhouse

volumes:
  plausible-db-data:
  plausible-events-db-data:
